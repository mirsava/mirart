# Render Blueprint: one API (Web Service) and one frontend (Static Site).
# Secrets are marked sync: false, so Render asks for them in the dashboard and they never live in git.
# Replace the two URLs below if you use custom domains.
services:
  - type: web
    name: artzyla-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: FRONTEND_URL
        value: https://artzyla.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: SHIPPO_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

  - type: web
    name: artzyla
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://artzyla-api.onrender.com/api
      # Public address of the site, used for canonical links (e.g. https://artzyla.com). Must match
      # FRONTEND_URL on the API and the domain in public/robots.txt and index.html.
      - key: VITE_SITE_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    routes:
      # Sitemaps are generated live by the API; serve them on the site's own domain (search engines require that).
      # Replace the API URL if you use a custom domain for it.
      - type: rewrite
        source: /sitemap.xml
        destination: https://artzyla-api.onrender.com/sitemap.xml
      - type: rewrite
        source: /sitemap-static.xml
        destination: https://artzyla-api.onrender.com/sitemap-static.xml
      - type: rewrite
        source: /sitemap-listings.xml
        destination: https://artzyla-api.onrender.com/sitemap-listings.xml
      - type: rewrite
        source: /sitemap-artists.xml
        destination: https://artzyla-api.onrender.com/sitemap-artists.xml
      - type: rewrite
        source: /*
        destination: /index.html
